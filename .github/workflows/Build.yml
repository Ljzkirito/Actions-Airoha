name: Airoha Build and Release

on:
  workflow_dispatch:
    inputs:
      Cache:
        description: '使用上次编译缓存或保存本次编译缓存'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      Config:
        description: '选择配置文件'
        required: true
        default: 'xg-040g-mf-ubi-mini.config'
        type: choice
        options:
          - 'xg-040g-mf-ubi.config'
          - 'xg-040g-mf-ubi-mini.config'
          - 'ponwrt/configs/an7581.config'
          - 'ponwrt/configs/an7583.config'
      IPTV:
        description: '是否编译 luci-app-iptv'
        required: true
        default: 'keep'
        type: choice
        options:
          - 'keep'
          - 'enable'
          - 'disable'

env:
  REPO_URL: https://github.com/pbs05/ponwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ github.event.inputs.Config }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
  
    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo "CPU核心数量: $(nproc)"
        echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息:"
        echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Optimize Disk Space
      uses: hugoalh/disk-space-optimizer-ghaction@v0.8
      timeout-minutes: 15
      with:
        operate_async: "True"
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "False"
        os_swap: "False"

    - name: Initialization environment
      timeout-minutes: 30
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt -yqq install dos2unix
        sudo -E apt -yqq install libfuse-dev
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Checkout
      uses: actions/checkout@main

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone -b $REPO_BRANCH --depth=1 $REPO_URL Airoha
        ln -sf /workdir/Airoha $GITHUB_WORKSPACE/Airoha

    - name: Resolve config file
      run: |
        if [ "${{ github.event.inputs.Config }}" = "ponwrt/configs/an7581.config" ]; then
          echo "Using an7581 config from cloned repo ..."
          cp Airoha/configs/an7581.config orig-an7581.config
          echo "CONFIG_FILE=orig-an7581.config" >> $GITHUB_ENV
        elif [ "${{ github.event.inputs.Config }}" = "ponwrt/configs/an7583.config" ]; then
          echo "Using an7583 config from cloned repo ..."
          cp Airoha/configs/an7583.config orig-an7583.config
          echo "CONFIG_FILE=orig-an7583.config" >> $GITHUB_ENV
        fi

    - name: Cache Toolchain
      uses: HiGarfield/cachewrtbuild@main
      if: github.event.inputs.Cache == 'true'
      with:
        ccache: 'false'
        clean: 'false'
        mixkey: 'airoha'
        prefix: ${{ github.workspace }}/Airoha

    - name: Load custom feeds (DIY_P1_SH)
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF Airoha/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd Airoha
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd Airoha && ./scripts/feeds update -a

    - name: Install feeds
      run: cd Airoha && ./scripts/feeds install -a

    - name: Load custom configuration (DIY_P2_SH)
      run: |
        [ -e files ] && mv files Airoha/files
        chmod +x $DIY_P2_SH
        cd Airoha
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Configure IPTV
      run: |
        if [ -e "$CONFIG_FILE" ]; then
          case "${{ github.event.inputs.IPTV }}" in
            enable)
              sed -i '/CONFIG_PACKAGE_luci-app-iptv/d' "$CONFIG_FILE"
              [ -n "$(tail -c1 "$CONFIG_FILE")" ] && echo >> "$CONFIG_FILE"
              echo "CONFIG_PACKAGE_luci-app-iptv=y" >> "$CONFIG_FILE"
              echo "IPTV: enabled"
              ;;
            disable)
              sed -i '/CONFIG_PACKAGE_luci-app-iptv/d' "$CONFIG_FILE"
              [ -n "$(tail -c1 "$CONFIG_FILE")" ] && echo >> "$CONFIG_FILE"
              echo "# CONFIG_PACKAGE_luci-app-iptv is not set" >> "$CONFIG_FILE"
              echo "IPTV: disabled"
              ;;
            *)
              echo "IPTV: keep (skip)"
              ;;
          esac
        else
          echo "Config file $CONFIG_FILE not found, skip"
        fi

    - name: Download package
      id: package
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE Airoha/.config
        cd Airoha
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd Airoha
        #echo -e "$(nproc) thread compile"
        make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: Airoha_bin${{ env.FILE_DATE }}
        path: Airoha/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd Airoha/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: Airoha_firmware${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

        case "${{ github.event.inputs.IPTV }}" in
          enable)  IPTV_TEXT="启用" ;;
          disable) IPTV_TEXT="禁用" ;;
          *)       IPTV_TEXT="不修改" ;;
        esac
        case "${{ github.event.inputs.Cache }}" in
          true) CACHE_TEXT="启用" ;;
          *)    CACHE_TEXT="禁用" ;;
        esac

        cat > release.txt <<EOF
        ## Build Release $(date +"%Y.%m.%d %H:%M")

        ### 构建信息

        | 项目 | 内容 |
        | --- | --- |
        | 源码仓库 | [$REPO_URL]($REPO_URL) |
        | 源码分支 | \`$REPO_BRANCH\` |
        | 配置来源 | \`${{ github.event.inputs.Config }}\` |
        | luci-app-iptv | $IPTV_TEXT |
        | 编译缓存 | $CACHE_TEXT |

        ### 附件说明

        - \`initramfs-recovery\`：临时启动固件
        - \`squashfs-sysupgrade\`：日常升级固件
        - \`*.itb\`：UBI分区固件
        - \`*.bin\`：stock分区固件
        - \`build.config\`：本次构建实际使用的完整配置
        - 请使用此处[pbs05/uboot-an758x](https://github.com/pbs05/uboot-an758x)文件
        EOF

        echo "status=success" >> $GITHUB_OUTPUT
        mv Airoha/.config Airoha/build.config

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        token: ${{ github.token }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.itb
          ${{ env.FIRMWARE }}/*.bin
          Airoha/build.config

    - name: Remove old Releases and Workflows
      uses: ophub/delete-releases-workflows@main
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        delete_releases: true
        releases_keep_latest: 10
        delete_tags: true
        delete_workflows: true
        workflows_keep_day: 10
        gh_token: ${{ github.token }}